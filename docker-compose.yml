services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docpipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docpipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docpipeline?schema=public
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PATH: /app/uploads
      RUN_WORKER_IN_PROCESS: "false"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    healthcheck:
      # Reports healthy only once the database is reachable — which is after
      # `prisma migrate deploy` has finished. This is what the worker waits on.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    command: npm run dev:worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docpipeline?schema=public
      NODE_ENV: development
      STORAGE_PATH: /app/uploads
      MOCK_PROCESSOR_MODE: random
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: npm run dev
    environment:
      # Read by the browser, not the container, so it must be the host-facing
      # URL rather than the compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the container's node_modules and .next off the
      # bind mount: without them the container writes a root-owned .next into
      # ./frontend and a later host-side `npm run build` fails with EACCES.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
