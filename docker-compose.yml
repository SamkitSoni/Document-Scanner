services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docpipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docpipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docpipeline?schema=public
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PATH: /app/uploads
      RUN_WORKER_IN_PROCESS: "false"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: npm run dev:worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docpipeline?schema=public
      NODE_ENV: development
      STORAGE_PATH: /app/uploads
      MOCK_PROCESSOR_MODE: random
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
